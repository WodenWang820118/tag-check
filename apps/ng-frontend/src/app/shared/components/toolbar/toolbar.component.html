<mat-toolbar color="primary">
  <mat-toolbar-row>
    @if (this.snav()) {
      <button
        mat-icon-button
        aria-label="Toggle menu"
        (click)="this.snav()?.toggle()"
      >
        <mat-icon>menu</mat-icon>
      </button>
    }
    <a
      class="toolbar__home"
      [routerLink]="['/']"
      aria-label="TagCheck projects"
      data-testid="toolbar-home"
      >TagCheck</a
    >

    @defer (
      when this.snav() && this.settings() && this.projects();
      prefetch on idle
    ) {
      <mat-form-field
        appearance="outline"
        color="primary"
        style="margin-left: 1rem; margin-top: 20px"
        class="density-compact"
      >
        <!-- <mat-label>Project</mat-label> -->
        <mat-select
          [(value)]="selectedProject"
          (valueChange)="onChangeProject($event)"
        >
          @for (project of projects(); track project.projectSlug) {
            <mat-option [value]="project.projectSlug">{{
              project.projectName
            }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    }

    <span class="spacer"></span>
    @if (isHomeView()) {
      @if (!isSearchVisible()) {
        <button
          id="top-search-button"
          data-testid="toolbar-search"
          mat-icon-button
          aria-label="Open search"
          (click)="toggleSearch()"
          style="cursor: pointer"
        >
          <mat-icon>search</mat-icon>
        </button>
        <button
          id="new-project-button"
          mat-icon-button
          aria-label="New project"
          [routerLink]="['/init-project']"
          data-testid="toolbar-new-project"
          matTooltip="New Project"
          style="cursor: pointer"
        >
          <mat-icon>add</mat-icon>
        </button>
        <button
          id="documentation-button"
          data-testid="toolbar-help"
          mat-icon-button
          aria-label="Help center"
          [routerLink]="['/documentation']"
          matTooltip="Help Center"
          style="cursor: pointer"
        >
          <mat-icon>help_outline</mat-icon>
        </button>
      }
      @if (isSearchVisible()) {
        <div class="filter-container density-compact">
          <mat-form-field appearance="outline" class="filter density-compact">
            <input
              matInput
              (keyup)="applyFilter($event)"
              #input
              class="filter__input"
              placeholder="Search projects"
              aria-label="Search projects"
              data-testid="toolbar-search-input"
            />
            <button
              matSuffix
              mat-icon-button
              aria-label="Clear search"
              aria-hidden="false"
              aria-controls="input"
              (click)="closeSearch()"
              class="filter__clear"
            >
              <mat-icon class="filter__icon">close</mat-icon>
            </button>
          </mat-form-field>
        </div>
      }
    }
  </mat-toolbar-row>
</mat-toolbar>
