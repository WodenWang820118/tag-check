<div class="settings">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Project Information</mat-card-title>
      <mat-card-subtitle>Settings within the project.</mat-card-subtitle>
    </mat-card-header>
    <br />
    <mat-card-content>
      <form
        class="project-info-form"
        (submit)="$event.preventDefault(); onSubmit()"
      >
        <mat-form-field class="project-info-form__field" appearance="outline">
          <mat-label>Project Name</mat-label>
          <input matInput [formField]="f.projectName" />
        </mat-form-field>
        <mat-form-field class="project-info-form__field" appearance="outline">
          <mat-label>Measurement ID</mat-label>
          <input matInput [formField]="f.measurementId" />
        </mat-form-field>
        <mat-form-field class="project-info-form__field" appearance="outline">
          <mat-label>Project Description</mat-label>
          <textarea matInput [formField]="f.projectDescription"></textarea>
        </mat-form-field>
        <mat-card-actions align="end" style="gap: 1rem">
          <button mat-raised-button color="primary">Save</button>
        </mat-card-actions>
      </form>
    </mat-card-content>
  </mat-card>
</div>
