<div class="settings">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Authentication</mat-card-title>
      <mat-card-subtitle>For HTTP authentication</mat-card-subtitle>
    </mat-card-header>
    <br />
    <mat-card-content>
      <form
        class="authentication-form"
        (submit)="$event.preventDefault(); onSubmit()"
      >
        <mat-form-field class="authentication-form__field" appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput [formField]="f.username" />
        </mat-form-field>
        <mat-form-field class="authentication-form__field" appearance="outline">
          <mat-label>Password</mat-label>
          <input
            matInput
            [formField]="f.password"
            autocomplete="off"
            [type]="showPassword() ? 'text' : 'password'"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            [attr.aria-label]="
              showPassword() ? 'Hide password' : 'Show password'
            "
            (click)="showPassword.set(!showPassword())"
          >
            <mat-icon>{{
              showPassword() ? 'visibility_off' : 'visibility'
            }}</mat-icon>
          </button>
        </mat-form-field>
        <mat-card-actions align="end" style="gap: 1rem">
          <button mat-raised-button color="primary">Save</button>
        </mat-card-actions>
      </form>
    </mat-card-content>
  </mat-card>
</div>
