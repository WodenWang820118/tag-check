<mat-toolbar class="report-toolbar mat-elevation-z0">
  <button
    mat-icon-button
    class="icon"
    matTooltip="Add tests"
    matTooltipPosition="above"
    aria-label="Add tests"
    data-testid="tests-add"
    (click)="emitAddEvent()"
  >
    <mat-icon>add</mat-icon>
  </button>
  <button
    mat-icon-button
    class="icon"
    matTooltip="Delete"
    matTooltipPosition="above"
    aria-label="Delete"
    data-testid="tests-delete"
    [disabled]="!hasSelection()"
    (click)="deleteSelected()"
  >
    <mat-icon>delete_outline</mat-icon>
  </button>

  <button
    mat-icon-button
    class="icon"
    matTooltip="Stop the running test"
    matTooltipPosition="above"
    aria-label="Stop the running test"
    data-testid="tests-stop"
    [disabled]="!isRunningTest()"
    (click)="stopOperation()"
  >
    <mat-icon>cancel</mat-icon>
  </button>
  <div class="spacer"></div>
  @if (!isSearchVisible()) {
    <mat-button-toggle-group
      #group="matButtonToggleGroup"
      (change)="onToggleChange($event)"
    >
      <mat-button-toggle value="search" aria-label="search event">
        <mat-icon color="primary">search</mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  }
  @if (isSearchVisible()) {
    <mat-form-field appearance="outline" class="filter" color="primary">
      <mat-label>Filter</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="add_to_cart"
        #input
      />
    </mat-form-field>
  }
  <button
    mat-icon-button
    class="icon"
    matTooltip="Toggle prevention of default link/form navigation on the final replay click"
    matTooltipPosition="above"
    aria-label="Prevent navigation"
    data-testid="tests-prevent-navigation"
    [disabled]="!hasSelection() || isRunningTest() || isSavingNavigation()"
    (click)="preventNavigationSelected()"
  >
    <mat-icon>bookmark_border</mat-icon>
  </button>
</mat-toolbar>
