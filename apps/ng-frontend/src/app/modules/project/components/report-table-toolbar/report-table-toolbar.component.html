<mat-toolbar class="report-toolbar mat-elevation-z0">
  <button
    mat-icon-button
    class="icon"
    matTooltip="Add tests"
    matTooltipPosition="above"
    aria-label="Add tests"
    data-testid="tests-add"
    (click)="emitAddEvent()"
  >
    <mat-icon>add</mat-icon>
  </button>
  <button
    mat-icon-button
    class="icon"
    matTooltip="Run the selected tests one after another"
    matTooltipPosition="above"
    aria-label="Run the selected tests"
    data-testid="tests-run-selected"
    [disabled]="!canRunSelected()"
    (click)="runSelected()"
  >
    <mat-icon>playlist_play</mat-icon>
  </button>
  <button
    mat-icon-button
    class="icon"
    matTooltip="Schedule the selected tests"
    matTooltipPosition="above"
    aria-label="Schedule the selected tests"
    data-testid="tests-schedule-selected"
    [disabled]="!hasSelection()"
    (click)="scheduleSelected()"
  >
    <mat-icon>schedule</mat-icon>
  </button>
  <button
    mat-icon-button
    class="icon"
    matTooltip="Delete"
    matTooltipPosition="above"
    aria-label="Delete"
    data-testid="tests-delete"
    [disabled]="!hasSelection()"
    (click)="deleteSelected()"
  >
    <mat-icon>delete_outline</mat-icon>
  </button>

  <button
    mat-icon-button
    class="icon"
    matTooltip="Stop the running test"
    matTooltipPosition="above"
    aria-label="Stop the running test"
    data-testid="tests-stop"
    [disabled]="!isRunningTest()"
    (click)="stopOperation()"
  >
    <mat-icon>cancel</mat-icon>
  </button>
  <mat-slide-toggle
    class="run-headless"
    data-testid="tests-run-headless"
    matTooltip="Run tests without a browser window: the play button and Run selected. Until you choose, the project's browser setting applies."
    matTooltipPosition="above"
    [checked]="runHeadlessService.headless()"
    (change)="setRunHeadless($event.checked)"
    >Run headless</mat-slide-toggle
  >
  <div class="spacer"></div>
  @if (!isSearchVisible()) {
    <mat-button-toggle-group
      #group="matButtonToggleGroup"
      (change)="onToggleChange($event)"
    >
      <mat-button-toggle value="search" aria-label="search event">
        <mat-icon color="primary">search</mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  }
  @if (isSearchVisible()) {
    <mat-form-field appearance="outline" class="filter" color="primary">
      <mat-label>Filter</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="add_to_cart"
        #input
      />
    </mat-form-field>
  }
  <button
    mat-icon-button
    class="icon"
    matTooltip="Bookmark: on the last click, block the browser's default link and form navigation (single-page app routing still runs)"
    matTooltipPosition="above"
    aria-label="Bookmark: block default navigation on the last click"
    data-testid="tests-prevent-navigation"
    [disabled]="!hasSelection() || isRunningTest() || isSavingNavigation()"
    (click)="preventNavigationSelected()"
  >
    <mat-icon>bookmark_border</mat-icon>
  </button>
</mat-toolbar>
