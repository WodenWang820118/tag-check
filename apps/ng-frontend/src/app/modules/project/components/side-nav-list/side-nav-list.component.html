<div class="side-nav-list">
  <mat-nav-list>
    @for (item of items; track item.testId) {
      <mat-list-item
        tabindex="-1"
        [routerLink]="item.link"
        [class.secondary]="section() === item.section"
        (click)="onMenuClick()"
        [attr.data-testid]="item.testId"
      >
        <div class="mat-list-item-content">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span>{{ item.title }}</span>
          <div class="spacer"></div>
        </div>
      </mat-list-item>
    }
    <mat-list-item
      tabindex="-1"
      [class.secondary]="section() === 'settings'"
      (click)="toggleSettings()"
      data-testid="nav-settings"
    >
      <div class="mat-list-item-content">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span>Settings</span>
        <button
          class="btn-chevron"
          mat-icon-button
          aria-label="Toggle settings submenu"
          data-testid="nav-settings-toggle"
          aria-haspopup="true"
          [attr.aria-expanded]="isOpen()"
          (click)="$event.stopPropagation(); toggleSettings()"
          cdkOverlayOrigin
          #trigger="cdkOverlayOrigin"
        >
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </mat-list-item>
    <app-overlay
      [trigger]="trigger"
      [isOpen]="isOpen()"
      (closed)="isOpen.set(false)"
    >
      <mat-nav-list class="mat-elevation-z8" style="background-color: white">
        @for (item of settingsMenuItems; track item.testId) {
          <mat-list-item
            class="sub-list-item"
            [attr.data-testid]="item.testId"
            [routerLink]="item.link"
            [routerLinkActive]="['secondary']"
            (click)="onSubItemClick()"
          >
            <div matListItemTitle>{{ item.title }}</div>
          </mat-list-item>
        }
      </mat-nav-list>
    </app-overlay>
  </mat-nav-list>
</div>
