<mat-toolbar class="file-table-toolbar mat-elevation-z0">
  <button
    mat-icon-button
    class="icon"
    matTooltip="Delete"
    matTooltipPosition="above"
    aria-label="Delete"
    data-testid="reports-delete"
    (click)="deleteSelected()"
    [disabled]="!hasSelection()"
  >
    <mat-icon>delete_outline</mat-icon>
  </button>
  <button
    mat-icon-button
    class="icon"
    matTooltip="Download"
    matTooltipPosition="above"
    aria-label="Download"
    data-testid="reports-download"
    (click)="downloadSelected()"
    [disabled]="!hasSelection()"
  >
    <mat-icon>download</mat-icon>
  </button>

  @if (eventFilter(); as eventName) {
    <mat-chip-set aria-label="Event filter">
      <mat-chip
        data-testid="reports-event-filter"
        (removed)="clearEventFilter()"
      >
        Runs of {{ eventName }}
        <button
          matChipRemove
          aria-label="Show every run"
          data-testid="reports-event-filter-clear"
        >
          <mat-icon>cancel</mat-icon>
        </button>
      </mat-chip>
    </mat-chip-set>
  }

  <div class="spacer"></div>
  @if (!isSearchVisible()) {
    <mat-button-toggle-group
      #group="matButtonToggleGroup"
      (change)="onToggleChange($event)"
    >
      <mat-button-toggle
        value="search"
        aria-label="search event"
        [disabled]="!hasData()"
      >
        <mat-icon>search</mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  }
  @if (isSearchVisible()) {
    <mat-form-field appearance="outline" class="filter">
      <mat-label>Filter</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="add_to_cart"
        #searchInput
      />
    </mat-form-field>
  }
</mat-toolbar>
