<div class="report-table">
  <table
    data-testid="reports-table"
    mat-table
    [dataSource]="dataSource"
    multiTemplateDataRows
    matSort
    (matSortChange)="sortData($event)"
  >
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        @if (this.dataSource.data.length) {
          <mat-checkbox
            (change)="$event ? toggleAllRows() : null"
            [checked]="isAllSelected"
            [aria-label]="checkboxLabel()"
          >
          </mat-checkbox>
        }
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox
          (click)="$event.stopPropagation()"
          (keydown)="$event.stopPropagation()"
          (change)="toggleSelection(row)"
          [checked]="selection.isSelected(row)"
          [aria-label]="checkboxLabel(row)"
        >
        </mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="eventName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let element">
        <span>{{ element.eventName }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element">
        <app-run-status-chip
          [status]="runStatus(element)"
          [passed]="element.passed"
          [requestPassed]="element.requestPassed"
        ></app-run-status-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="completedTime">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Run at</th>
      <td mat-cell *matCellDef="let element">
        {{ element.runAt | date: 'medium' }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>

    <tr
      mat-row
      *matRowDef="let element; columns: columns"
      class="element-row"
    ></tr>
    <tr class="mat-mdc-row" *matNoDataRow>
      <td
        class="mat-mdc-cell file-table__empty"
        [attr.colspan]="columns.length"
      >
        No reports yet. Run a test from the Tests page to create one.
      </td>
    </tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 100]"
    aria-label="Select page of tests"
  ></mat-paginator>
</div>
