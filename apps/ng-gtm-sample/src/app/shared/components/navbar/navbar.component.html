<nav
  class="sample-shell flex flex-wrap items-center justify-between gap-3 py-5"
>
  <div class="flex flex-wrap items-center gap-3">
    <a
      class="flex items-center gap-3 rounded-full border border-white/80 bg-white/90 px-4 py-2 shadow-sm transition-transform hover:-translate-y-0.5"
      routerLink="/"
      href="/"
    >
      <span
        class="grid h-10 w-10 place-items-center rounded-full bg-blue-600 text-white"
      >
        <ng-icon name="lucideCompass" class="text-lg" />
      </span>
      <span class="leading-tight">
        <span
          class="block text-xs font-semibold tracking-[0.28em] text-blue-600 uppercase"
        >
          GTM Demo
        </span>
        <span class="block text-lg font-black tracking-tight text-slate-900">
          Travel Site
        </span>
      </span>
    </a>

    <div class="hidden h-8 w-px bg-slate-200 lg:block"></div>

    <div class="flex flex-wrap items-center gap-2">
      <button
        hlmBtn
        variant="ghost"
        size="lg"
        type="button"
        class="text-slate-600"
        data-testid="nav-home"
        (click)="navigateToHome()"
      >
        <ng-icon name="lucideHouse" />
        Home
      </button>
      <button
        hlmBtn
        variant="ghost"
        size="lg"
        type="button"
        class="text-slate-600"
        data-testid="nav-destinations"
        (click)="navigateToDestinations()"
      >
        <ng-icon name="lucideMap" />
        Destinations
      </button>
    </div>
  </div>

  <div class="flex flex-wrap items-center justify-end gap-2">
    <button
      hlmBtn
      size="lg"
      type="button"
      class="rounded-full bg-slate-950 px-4 text-white hover:bg-slate-800"
      data-testid="nav-admin"
      (click)="navigateToLogin()"
    >
      <ng-icon name="lucideUser" />
      Admin Area
    </button>

    <button
      hlmBtn
      size="lg"
      type="button"
      class="relative rounded-full bg-slate-950 px-4 text-white hover:bg-slate-800"
      data-testid="nav-cart"
      (click)="navigateToBasket()"
    >
      <ng-icon name="lucideShoppingCart" />
      Cart
      @if (cartItemCount() > 0) {
        <span
          class="absolute -top-1.5 -right-1.5 grid h-5 min-w-5 place-items-center rounded-full bg-red-500 px-1 text-[0.7rem] font-semibold text-white"
        >
          {{ cartItemCount() }}
        </span>
      }
    </button>
  </div>
</nav>
