name: Build
# Changes that touch only documents skip CI. A change with any other file
# still runs it. Markdown under apps/*/src and libs/*/src is not listed: it is
# site content (the documentation site renders libs/utils markdown).
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - '**/README.md'
      - '**/AGENTS.md'
      - '.github/**/*.md'
      - 'apps/*/docs/**'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '*.md'
      - '**/README.md'
      - '**/AGENTS.md'
      - '.github/**/*.md'
      - 'apps/*/docs/**'
      - 'docs/**'
      - 'LICENSE'
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Setup pnpm
        run: |
          corepack enable
          corepack install
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run format:check
        shell: bash
      - name: Lint
        run: pnpm run lint
        shell: bash
      - name: Update sitemap lastmod
        run: node tools/scripts/update-sitemap-lastmod.ts
        shell: bash
      - name: Backend integration tests
        run: pnpm run test-back:integration
        shell: bash
      - name: Release tooling tests
        run: pnpm run test:release-tools
        shell: bash
      - name: Test and coverage
        run: pnpm run test:cov
        shell: bash
      - name: Backend e2e tests with coverage
        run: pnpm run test-back:e2e:cov
        shell: bash
      - name: Merge coverage (unit + e2e)
        run: INCLUDE_E2E_COVERAGE=1 pnpm run coverage:merge
        shell: bash
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
