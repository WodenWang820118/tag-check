packages:
  - apps/**
  - libs/**
  # Tauri copies the built backend (with its package.json) into target/;
  # never treat that build output as a workspace package.
  - '!apps/desktop-tauri/src-tauri/target/**'

allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  ffmpeg-static: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  protobufjs: true
  puppeteer: true
  puppeteer-chromium-resolver: true
  sqlite3: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@nx/angular@24.0.3'
  - '@nx/cypress@24.0.3'
  - '@nx/devkit@24.0.3'
  - '@nx/docker@24.0.3'
  - '@nx/eslint-plugin@24.0.3'
  - '@nx/eslint@24.0.3'
  - '@nx/jest@24.0.3'
  - '@nx/js@24.0.3'
  - '@nx/nest@24.0.3'
  - '@nx/node@24.0.3'
  - '@nx/nx-darwin-arm64@24.0.3'
  - '@nx/nx-darwin-x64@24.0.3'
  - '@nx/nx-freebsd-x64@24.0.3'
  - '@nx/nx-linux-arm-gnueabihf@24.0.3'
  - '@nx/nx-linux-arm64-gnu@24.0.3'
  - '@nx/nx-linux-arm64-musl@24.0.3'
  - '@nx/nx-linux-x64-gnu@24.0.3'
  - '@nx/nx-linux-x64-musl@24.0.3'
  - '@nx/nx-win32-arm64-msvc@24.0.3'
  - '@nx/nx-win32-x64-msvc@24.0.3'
  - '@nx/oxlint@24.0.3'
  - '@nx/playwright@24.0.3'
  - '@nx/rspack@24.0.3'
  - '@nx/storybook@24.0.3'
  - '@nx/vite@24.0.3'
  - '@nx/vitest@24.0.3'
  - '@nx/web@24.0.3'
  - '@nx/workspace@24.0.3'
  - nx@24.0.3

onlyBuiltDependencies:
  - '@firebase/util'
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@scarf/scarf'
  - '@swc/core'
  - core-js
  - core-js-pure
  - esbuild
  - ffmpeg-static
  - less
  - lmdb
  - msgpackr-extract
  - nx
  - protobufjs
  - puppeteer
  - puppeteer-chromium-resolver
  - sqlite3
  - tag-check
  - unrs-resolver
